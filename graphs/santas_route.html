        {id: "Santa_Bag", type: "event", color: "#8b4513", size: 20, description: "ðŸŽ’ Santa's Bag | Holds all gifts | Magically bottomless | Never runs out"},
    ];

    // *** START EDGES ***
    const edges = [
        // SANTA'S FAMILY
        {source: "Santa", target: "Mrs_Claus", type: "family", label: "married to"},
        {source: "Santa", target: "North_Pole", type: "divine", label: "lives at"},
        {source: "Santa", target: "Santas_House", type: "divine", label: "home"},
        {source: "Mrs_Claus", target: "Santas_House", type: "divine", label: "lives in"},
        
        // REINDEER TEAM - Rudolph leads all
        {source: "Santa", target: "Rudolph", type: "alliance", label: "leads sleigh"},
        {source: "Rudolph", target: "Dasher", type: "alliance", label: "team"},
        {source: "Rudolph", target: "Dancer", type: "alliance", label: "team"},
        {source: "Rudolph", target: "Prancer", type: "alliance", label: "team"},
        {source: "Rudolph", target: "Vixen", type: "alliance", label: "team"},
        {source: "Rudolph", target: "Comet", type: "alliance", label: "team"},
        {source: "Rudolph", target: "Cupid", type: "alliance", label: "team"},
        {source: "Rudolph", target: "Donner", type: "alliance", label: "team"},
        {source: "Rudolph", target: "Blitzen", type: "alliance", label: "team"},

        {source: "Santa", target: "Head_Elf", type: "mentor", label: "supervises"},

        {source: "Toy_Makers", target: "Toy_Workshop", type: "event", label: "work in"},
        {source: "Gift_Wrappers", target: "Toy_Workshop", type: "event", label: "work in"},
        {source: "Sleigh_Engineer", target: "Magic_Sleigh", type: "event", label: "maintains"},
        {source: "Sleigh_Engineer", target: "Rudolph", type: "alliance", label: "checks harness"},
        {source: "Toy_Workshop", target: "North_Pole", type: "event", label: "located at"},
        
        // PREPARATION PHASE
        {source: "Santa", target: "Naughty_Nice_List", type: "event", label: "maintains"},
        {source: "Naughty_Nice_List", target: "Preparation", type: "timeline", label: "guides"},
        {source: "Toy_Workshop", target: "Preparation", type: "timeline", label: "supplies"},
        {source: "Preparation", target: "Christmas_Eve", type: "timeline", label: "leads to"},
        
        // SLEIGH & EQUIPMENT

    const width = window.innerWidth;
    const height = window.innerHeight;

    const svg = d3.select("#graph")

        .attr("height", height);

    let activeFilters = new Set(['hero', 'character', 'location', 'event']);

    const simulation = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(edges).id(d => d.id).distance(120))
        .force("charge", d3.forceManyBody().strength(-400))
        .force("center", d3.forceCenter(width / 2, height / 2))
        .force("collision", d3.forceCollide().radius(d => d.size + 10));

    const link = svg.append("g")
        .selectAll("line")
        .data(edges)
        .enter().append("line")
        .attr("class", d => `link ${d.type}`)
        .attr("stroke-width", 2);

    const linkLabels = svg.append("g")
        .selectAll("text")
        .data(edges)
        .enter().append("text")
        .attr("class", "link-label")
        .text(d => d.label);

    const node = svg.append("g")
        .selectAll("g")
        .data(nodes)
        .enter().append("g")
        .attr("class", "node")
        .call(d3.drag()
            .on("start", dragstarted)
            .on("drag", dragged)
            .on("end", dragended))
        .on("click", showInfo)
        .on("mouseover", showTooltip)
        .on("mouseout", hideTooltip);

        .attr("r", d => d.size)
        .attr("fill", d => d.color);

        .attr("dy", d => d.size + 12)
        .text(d => d.id.replace(/_/g, " "));

        link
            .attr("x1", d => d.source.x)
            .attr("y1", d => d.source.y)
            .attr("x2", d => d.target.x)
            .attr("y2", d => d.target.y);

        linkLabels
            .attr("x", d => (d.source.x + d.target.x) / 2)
            .attr("y", d => (d.source.y + d.target.y) / 2);

        node.attr("transform", d => `translate(${d.x},${d.y})`);
    });

    function dragstarted(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
    }

    function dragged(event, d) {
        d.fx = event.x;
        d.fy = event.y;
    }

    function dragended(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null;
        d.fy = null;
    }

    function toggleFilter(type) {
        const btn = event.target;
        if (activeFilters.has(type)) {
            activeFilters.delete(type);
            btn.classList.remove('active');
        } else {
            activeFilters.add(type);
            btn.classList.add('active');
        }
        
        node.style("display", d => activeFilters.has(d.type) ? "block" : "none");
        link.style("display", d => {
            const sourceVisible = activeFilters.has(d.source.type);
            const targetVisible = activeFilters.has(d.target.type);
            return sourceVisible && targetVisible ? "block" : "none";
        });
        linkLabels.style("display", d => {
            const sourceVisible = activeFilters.has(d.source.type);
            const targetVisible = activeFilters.has(d.target.type);
            return sourceVisible && targetVisible ? "block" : "none";
        });
    }

    function resetSimulation() {
        nodes.forEach(d => {
            d.fx = null;
            d.fy = null;
        });
        simulation.alpha(1).restart();
    }

    function showStats() {
        const stats = `
            <div class="info-section">
                <strong>Total Nodes:</strong> ${nodes.length}<br>
                <strong>Total Edges:</strong> ${edges.length}<br>
                <strong>Heroes:</strong> ${nodes.filter(n => n.type === 'hero').length}<br>
                <strong>Characters:</strong> ${nodes.filter(n => n.type === 'character').length}<br>
                <strong>Locations:</strong> ${nodes.filter(n => n.type === 'location').length}<br>
                <strong>Events:</strong> ${nodes.filter(n => n.type === 'event').length}
            </div>
        `;
        document.getElementById("nodeTitle").textContent = "ðŸ“Š Graph Statistics";
        document.getElementById("nodeDescription").innerHTML = stats;
        document.getElementById("infoPanel").style.display = "block";
    }

    function showInfo(event, d) {
        document.getElementById("nodeTitle").textContent = d.id.replace(/_/g, " ");
        document.getElementById("nodeDescription").innerHTML = `
            <div class="info-section">
                ${d.description}
            </div>
        `;
        document.getElementById("infoPanel").style.display = "block";
    }

    function closeInfo() {
        document.getElementById("infoPanel").style.display = "none";
    }

    function showTooltip(event, d) {
        const tooltip = document.getElementById("tooltip");
        tooltip.textContent = d.id.replace(/_/g, " ");
        tooltip.style.display = "block";
        tooltip.style.left = (event.pageX + 10) + "px";
        tooltip.style.top = (event.pageY - 20) + "px";
    }

    function hideTooltip() {
        document.getElementById("tooltip").style.display = "none";
    }
</script>
</body>
</html>
