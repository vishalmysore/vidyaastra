<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidyaAstra: Game of Thrones - Houses & Characters Network</title>
    <script src="https://unpkg.com/d3@7.8.5/dist/d3.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cinzel', 'Georgia', serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #0d0d0d 100%);
            overflow: hidden;
            color: #fff;
        }

        svg {
            display: block;
            background: transparent;
        }

        .node circle {
            stroke: #fff;
            stroke-width: 2px;
            cursor: pointer;
            transition: all 0.3s;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.3));
        }

        .node:hover circle {
            stroke-width: 4px;
            filter: drop-shadow(0 0 20px rgba(255,215,0,0.9));
        }

        .node text {
            font-size: 10px;
            font-weight: bold;
            pointer-events: none;
            text-anchor: middle;
            fill: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,1);
        }

        .link {
            stroke: rgba(150, 150, 150, 0.3);
            stroke-width: 1.5px;
            fill: none;
        }

        .link.family {
            stroke: #8B7355;
            stroke-width: 2.5px;
            opacity: 0.7;
        }

        .link.alliance {
            stroke: #4A90E2;
            stroke-width: 2px;
            opacity: 0.6;
        }

        .link.enemy {
            stroke: #DC143C;
            stroke-width: 2.5px;
            opacity: 0.7;
        }

        .link.serves {
            stroke: #9370DB;
            stroke-width: 1.5px;
            opacity: 0.5;
        }

        .link.kills {
            stroke: #8B0000;
            stroke-width: 3px;
            opacity: 0.8;
            stroke-dasharray: 5, 5;
        }

        .link-label {
            font-size: 8px;
            fill: #FFD700;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        #legend {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #FFD700;
            max-width: 250px;
        }

        #legend h3 {
            margin-bottom: 10px;
            color: #FFD700;
            font-size: 16px;
            text-align: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
            font-size: 11px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 8px;
            border: 2px solid #fff;
        }

        #title {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 3px 3px 6px rgba(0,0,0,1);
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="title">âš”ï¸ Game of Thrones Network âš”ï¸</div>
    <div id="legend">
        <h3>Great Houses</h3>
        <div class="legend-item">
            <div class="legend-color" style="background: #8B8B8B;"></div>
            <span>Stark (Winter is Coming)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #DC143C;"></div>
            <span>Lannister (Hear Me Roar)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #8B0000;"></div>
            <span>Targaryen (Fire and Blood)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #FFD700;"></div>
            <span>Baratheon (Ours is the Fury)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #228B22;"></div>
            <span>Tyrell (Growing Strong)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #2F4F4F;"></div>
            <span>Greyjoy (We Do Not Sow)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #FF8C00;"></div>
            <span>Martell (Unbowed, Unbent, Unbroken)</span>
        </div>
    </div>
    <svg id="network"></svg>

    <script>
        const width = window.innerWidth;
        const height = window.innerHeight;

        const svg = d3.select("#network")
            .attr("width", width)
            .attr("height", height);

        // House colors
        const houseColors = {
            "Stark": "#8B8B8B",
            "Lannister": "#DC143C",
            "Targaryen": "#8B0000",
            "Baratheon": "#FFD700",
            "Greyjoy": "#2F4F4F",
            "Tyrell": "#228B22",
            "Martell": "#FF8C00",
            "Night's Watch": "#000000",
            "Wildling": "#8B4513"
        };

        const nodes = [
            // Stark
            { id: "NedStark", label: "Eddard Stark", house: "Stark", type: "Lord" },
            { id: "CatelynStark", label: "Catelyn Stark", house: "Stark", type: "Lady" },
            { id: "RobbStark", label: "Robb Stark", house: "Stark", type: "King" },
            { id: "SansaStark", label: "Sansa Stark", house: "Stark", type: "Queen" },
            { id: "AryaStark", label: "Arya Stark", house: "Stark", type: "Assassin" },
            { id: "BranStark", label: "Bran Stark", house: "Stark", type: "King" },
            { id: "JonSnow", label: "Jon Snow", house: "Stark", type: "King" },
            
            // Lannister
            { id: "TywinLannister", label: "Tywin Lannister", house: "Lannister", type: "Lord" },
            { id: "CerseiLannister", label: "Cersei Lannister", house: "Lannister", type: "Queen" },
            { id: "JaimeLannister", label: "Jaime Lannister", house: "Lannister", type: "Knight" },
            { id: "TyrionLannister", label: "Tyrion Lannister", house: "Lannister", type: "Hand" },
            { id: "JoffreyBaratheon", label: "Joffrey Baratheon", house: "Lannister", type: "King" },
            
            // Targaryen
            { id: "DaenerysTargaryen", label: "Daenerys Targaryen", house: "Targaryen", type: "Queen" },
            { id: "ViserysTargaryen", label: "Viserys Targaryen", house: "Targaryen", type: "Prince" },
            { id: "Drogon", label: "Drogon", house: "Targaryen", type: "Dragon" },
            
            // Baratheon
            { id: "RobertBaratheon", label: "Robert Baratheon", house: "Baratheon", type: "King" },
            { id: "StannisBaratheon", label: "Stannis Baratheon", house: "Baratheon", type: "King" },
            { id: "RenlyBaratheon", label: "Renly Baratheon", house: "Baratheon", type: "Lord" },
            
            // Others
            { id: "Melisandre", label: "Melisandre", house: "Baratheon", type: "Priestess" },
            { id: "Varys", label: "Varys", house: "None", type: "Spymaster" },
            { id: "LittleFinger", label: "Petyr Baelish", house: "None", type: "Schemer" },
            { id: "TheonGreyjoy", label: "Theon Greyjoy", house: "Greyjoy", type: "Prince" }
        ];

        const links = [
            // Stark family
            { source: "NedStark", target: "CatelynStark", type: "family", label: "married" },
            { source: "NedStark", target: "RobbStark", type: "family", label: "father" },
            { source: "NedStark", target: "SansaStark", type: "family", label: "father" },
            { source: "NedStark", target: "AryaStark", type: "family", label: "father" },
            { source: "NedStark", target: "BranStark", type: "family", label: "father" },
            { source: "NedStark", target: "JonSnow", type: "family", label: "raised as father" },
            
            // Lannister family
            { source: "TywinLannister", target: "CerseiLannister", type: "family", label: "father" },
            { source: "TywinLannister", target: "JaimeLannister", type: "family", label: "father" },
            { source: "TywinLannister", target: "TyrionLannister", type: "family", label: "father" },
            { source: "CerseiLannister", target: "JaimeLannister", type: "family", label: "twin" },
            { source: "CerseiLannister", target: "JoffreyBaratheon", type: "family", label: "mother" },
            
            // Targaryen
            { source: "DaenerysTargaryen", target: "ViserysTargaryen", type: "family", label: "sister" },
            { source: "DaenerysTargaryen", target: "Drogon", type: "alliance", label: "rides" },
            { source: "DaenerysTargaryen", target: "JonSnow", type: "alliance", label: "loves" },
            
            // Marriages & Alliances
            { source: "RobertBaratheon", target: "CerseiLannister", type: "family", label: "married" },
            { source: "SansaStark", target: "JoffreyBaratheon", type: "alliance", label: "betrothed" },
            { source: "SansaStark", target: "TyrionLannister", type: "family", label: "forced marriage" },
            
            // Enmities
            { source: "NedStark", target: "CerseiLannister", type: "enemy", label: "discovered secret" },
            { source: "JaimeLannister", target: "NedStark", type: "kills", label: "conflict" },
            { source: "JoffreyBaratheon", target: "NedStark", type: "kills", label: "executed" },
            { source: "AryaStark", target: "JoffreyBaratheon", type: "enemy", label: "hates" },
            { source: "TyrionLannister", target: "JoffreyBaratheon", type: "enemy", label: "accused" },
            { source: "TyrionLannister", target: "TywinLannister", type: "kills", label: "murdered" },
            
            // Service
            { source: "JaimeLannister", target: "CerseiLannister", type: "serves", label: "protects" },
            { source: "Varys", target: "RobertBaratheon", type: "serves", label: "advisor" },
            { source: "LittleFinger", target: "CerseiLannister", type: "alliance", label: "schemes with" },
            { source: "Melisandre", target: "StannisBaratheon", type: "serves", label: "priestess" },
            
            // Brotherhood
            { source: "RobbStark", target: "TheonGreyjoy", type: "alliance", label: "raised together" },
            { source: "TheonGreyjoy", target: "RobbStark", type: "enemy", label: "betrayed" }
        ];

        const simulation = d3.forceSimulation(nodes)
            .force("link", d3.forceLink(links).id(d => d.id).distance(150))
            .force("charge", d3.forceManyBody().strength(-500))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collision", d3.forceCollide().radius(35));

        const link = svg.append("g")
            .selectAll("line")
            .data(links)
            .enter().append("line")
            .attr("class", d => `link ${d.type}`)
            .attr("marker-end", "url(#arrowhead)");

        const linkLabel = svg.append("g")
            .selectAll("text")
            .data(links)
            .enter().append("text")
            .attr("class", "link-label")
            .text(d => d.label);

        const node = svg.append("g")
            .selectAll("g")
            .data(nodes)
            .enter().append("g")
            .attr("class", "node")
            .call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended));

        node.append("circle")
            .attr("r", d => d.type === "Dragon" ? 25 : d.type === "King" || d.type === "Queen" ? 20 : 15)
            .attr("fill", d => houseColors[d.house] || "#666");

        node.append("text")
            .attr("dy", 30)
            .text(d => d.label);

        simulation.on("tick", () => {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);

            linkLabel
                .attr("x", d => (d.source.x + d.target.x) / 2)
                .attr("y", d => (d.source.y + d.target.y) / 2);

            node
                .attr("transform", d => `translate(${d.x},${d.y})`);
        });

        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }
    </script>
</body>
</html>
