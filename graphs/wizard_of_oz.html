<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidyaAstra: The Wizard of Oz - Journey to the Emerald City</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #87CEEB 0%, #FFD700 50%, #32CD32 100%);
            overflow: hidden;
            color: #333;
        }

        svg {
            display: block;
            background: transparent;
        }

        .node circle {
            stroke: #fff;
            stroke-width: 3px;
            cursor: pointer;
            transition: all 0.3s;
            filter: drop-shadow(0 0 10px rgba(255,215,0,0.5));
        }

        .node:hover circle {
            stroke-width: 5px;
            filter: drop-shadow(0 0 20px rgba(255,215,0,1));
        }

        .node text {
            font-size: 11px;
            font-weight: bold;
            pointer-events: none;
            text-anchor: middle;
            fill: #000;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.9);
        }

        .link {
            stroke: rgba(255, 215, 0, 0.4);
            stroke-width: 2px;
            fill: none;
        }

        .link.journey {
            stroke: #FFD700;
            stroke-width: 4px;
            opacity: 0.8;
            stroke-dasharray: 5, 5;
            animation: dash 2s linear infinite;
        }

        @keyframes dash {
            to {
                stroke-dashoffset: -10;
            }
        }

        .link.friendship {
            stroke: #FF69B4;
            stroke-width: 2.5px;
            opacity: 0.7;
        }

        .link.seeks {
            stroke: #9370DB;
            stroke-width: 2px;
            opacity: 0.6;
        }

        .link.defeats {
            stroke: #DC143C;
            stroke-width: 3px;
            opacity: 0.8;
        }

        .link.rules {
            stroke: #32CD32;
            stroke-width: 2.5px;
            opacity: 0.7;
        }

        .link-label {
            font-size: 9px;
            fill: #000;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.9);
            pointer-events: none;
        }

        #legend {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 12px;
            border: 3px solid #FFD700;
            max-width: 250px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }

        #legend h3 {
            margin-bottom: 10px;
            color: #8B4513;
            font-size: 16px;
            text-align: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
            font-size: 11px;
            color: #333;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 8px;
            border: 2px solid #000;
        }

        #title {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 32px;
            font-weight: bold;
            color: #8B4513;
            text-shadow: 3px 3px 6px rgba(255,215,0,1);
            z-index: 10;
        }

        #subtitle {
            position: absolute;
            top: 60px;
            left: 20px;
            font-size: 16px;
            font-style: italic;
            color: #000;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.9);
        }
    </style>
</head>
<body>
    <div id="title">🌈 The Wizard of Oz 🌈</div>
    <div id="subtitle">Follow the Yellow Brick Road</div>
    <div id="legend">
        <h3>Characters & Places</h3>
        <div class="legend-item">
            <div class="legend-color" style="background: #87CEEB;"></div>
            <span>Dorothy (Kansas)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #D2691E;"></div>
            <span>Scarecrow (Brain)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #C0C0C0;"></div>
            <span>Tin Man (Heart)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #DAA520;"></div>
            <span>Cowardly Lion (Courage)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #32CD32;"></div>
            <span>Wizard & Emerald City</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #8B008B;"></div>
            <span>Good Witch</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #000000;"></div>
            <span>Wicked Witch</span>
        </div>
    </div>
    <svg id="network"></svg>

    <script>
        const width = window.innerWidth;
        const height = window.innerHeight;

        const svg = d3.select("#network")
            .attr("width", width)
            .attr("height", height);

        const characterColors = {
            "Dorothy": "#87CEEB",
            "Scarecrow": "#D2691E",
            "TinMan": "#C0C0C0",
            "Lion": "#DAA520",
            "Wizard": "#32CD32",
            "GoodWitch": "#8B008B",
            "WickedWitch": "#000000",
            "EmeraldCity": "#00FF00",
            "Munchkinland": "#4169E1",
            "Kansas": "#8B4513",
            "YellowBrickRoad": "#FFD700"
        };

        const nodes = [
            // Main characters
            { id: "Dorothy", label: "Dorothy", type: "Hero", color: "Dorothy" },
            { id: "Scarecrow", label: "Scarecrow", type: "Companion", color: "Scarecrow" },
            { id: "TinMan", label: "Tin Woodman", type: "Companion", color: "TinMan" },
            { id: "Lion", label: "Cowardly Lion", type: "Companion", color: "Lion" },
            
            // Wizards & Witches
            { id: "Wizard", label: "Wizard of Oz", type: "Wizard", color: "Wizard" },
            { id: "Glinda", label: "Glinda the Good", type: "GoodWitch", color: "GoodWitch" },
            { id: "WickedWitchWest", label: "Wicked Witch of West", type: "WickedWitch", color: "WickedWitch" },
            { id: "WickedWitchEast", label: "Wicked Witch of East", type: "WickedWitch", color: "WickedWitch" },
            
            // Places
            { id: "Kansas", label: "Kansas", type: "Place", color: "Kansas" },
            { id: "Munchkinland", label: "Munchkinland", type: "Place", color: "Munchkinland" },
            { id: "EmeraldCity", label: "Emerald City", type: "Place", color: "EmeraldCity" },
            { id: "YellowBrickRoad", label: "Yellow Brick Road", type: "Path", color: "YellowBrickRoad" },
            
            // Virtues
            { id: "Brain", label: "Brain/Intelligence", type: "Virtue", color: "Scarecrow" },
            { id: "Heart", label: "Heart/Love", type: "Virtue", color: "TinMan" },
            { id: "Courage", label: "Courage", type: "Virtue", color: "Lion" },
            { id: "Home", label: "Home", type: "Virtue", color: "Dorothy" },
            
            // Artifacts
            { id: "SilverShoes", label: "Silver Shoes", type: "Artifact", color: "WickedWitch" },
            { id: "GoldenCap", label: "Golden Cap", type: "Artifact", color: "WickedWitch" }
        ];

        const links = [
            // Journey path
            { source: "Dorothy", target: "Kansas", type: "journey", label: "from" },
            { source: "Dorothy", target: "Munchkinland", type: "journey", label: "arrives" },
            { source: "Dorothy", target: "YellowBrickRoad", type: "journey", label: "follows" },
            { source: "YellowBrickRoad", target: "EmeraldCity", type: "journey", label: "leads to" },
            
            // Companions join
            { source: "Dorothy", target: "Scarecrow", type: "friendship", label: "befriends" },
            { source: "Dorothy", target: "TinMan", type: "friendship", label: "befriends" },
            { source: "Dorothy", target: "Lion", type: "friendship", label: "befriends" },
            { source: "Scarecrow", target: "TinMan", type: "friendship", label: "companions" },
            { source: "TinMan", target: "Lion", type: "friendship", label: "companions" },
            
            // Seeking virtues
            { source: "Scarecrow", target: "Brain", type: "seeks", label: "seeks" },
            { source: "TinMan", target: "Heart", type: "seeks", label: "seeks" },
            { source: "Lion", target: "Courage", type: "seeks", label: "seeks" },
            { source: "Dorothy", target: "Home", type: "seeks", label: "seeks" },
            
            // Wizard interactions
            { source: "Dorothy", target: "Wizard", type: "seeks", label: "asks for help" },
            { source: "Scarecrow", target: "Wizard", type: "seeks", label: "asks for brain" },
            { source: "TinMan", target: "Wizard", type: "seeks", label: "asks for heart" },
            { source: "Lion", target: "Wizard", type: "seeks", label: "asks for courage" },
            { source: "Wizard", target: "EmeraldCity", type: "rules", label: "rules" },
            
            // Good witch helps
            { source: "Glinda", target: "Dorothy", type: "friendship", label: "helps" },
            { source: "Glinda", target: "Munchkinland", type: "rules", label: "protects" },
            
            // Wicked witches
            { source: "Dorothy", target: "WickedWitchEast", type: "defeats", label: "house falls on" },
            { source: "Dorothy", target: "WickedWitchWest", type: "defeats", label: "melts with water" },
            { source: "WickedWitchWest", target: "Dorothy", type: "defeats", label: "threatens" },
            
            // Magical artifacts
            { source: "Dorothy", target: "SilverShoes", type: "seeks", label: "wears" },
            { source: "WickedWitchEast", target: "SilverShoes", type: "seeks", label: "owned" },
            { source: "SilverShoes", target: "Home", type: "seeks", label: "grants wish" },
            { source: "WickedWitchWest", target: "GoldenCap", type: "seeks", label: "controls monkeys" }
        ];

        const simulation = d3.forceSimulation(nodes)
            .force("link", d3.forceLink(links).id(d => d.id).distance(120))
            .force("charge", d3.forceManyBody().strength(-400))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collision", d3.forceCollide().radius(40));

        const link = svg.append("g")
            .selectAll("line")
            .data(links)
            .enter().append("line")
            .attr("class", d => `link ${d.type}`);

        const linkLabel = svg.append("g")
            .selectAll("text")
            .data(links)
            .enter().append("text")
            .attr("class", "link-label")
            .text(d => d.label);

        const node = svg.append("g")
            .selectAll("g")
            .data(nodes)
            .enter().append("g")
            .attr("class", "node")
            .call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended));

        node.append("circle")
            .attr("r", d => d.type === "Place" ? 25 : d.type === "Wizard" ? 22 : d.type === "Artifact" ? 15 : 18)
            .attr("fill", d => characterColors[d.color] || "#666");

        node.append("text")
            .attr("dy", 32)
            .text(d => d.label);

        simulation.on("tick", () => {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);

            linkLabel
                .attr("x", d => (d.source.x + d.target.x) / 2)
                .attr("y", d => (d.source.y + d.target.y) / 2);

            node
                .attr("transform", d => `translate(${d.x},${d.y})`);
        });

        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }
    </script>
</body>
</html>
