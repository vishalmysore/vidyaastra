<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidya Astra: Nala and Damayanti - Epic Network</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <style>
        /* CSS styles updated for Nala-Damayanti theme: Royal Golds, Deep Blues, and Forest Greens */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4a235a 0%, #2e4053 50%, #34495e 100%);
            overflow: hidden;
            color: #fff;
        }

        svg {
            display: block;
            background: transparent;
        }

        .node circle {
            stroke: #fff;
            stroke-width: 2px;
            cursor: pointer;
            transition: all 0.3s;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.2));
        }

        .node:hover circle {
            stroke-width: 4px;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.8));
        }

        .node text {
            font-size: 9px;
            font-weight: bold;
            pointer-events: none;
            text-anchor: middle;
            fill: #fff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
        }

        .link {
            stroke: rgba(100, 200, 255, 0.2);
            stroke-width: 1px;
            fill: none;
        }

        .link.relation {
            stroke: #f1c40f; /* Gold for main relationships */
            stroke-width: 2.5px;
            opacity: 0.8;
        }

        .link.divine {
            stroke: #8e44ad; /* Purple for divine intervention */
            stroke-width: 2px;
            opacity: 0.7;
        }

        .link.conflict {
            stroke: #e74c3c; /* Red for conflict/curse */
            stroke-width: 2.5px;
            opacity: 0.8;
        }

        .link.journey {
            stroke: #2ecc71; /* Green for journeys/paths */
            stroke-width: 1.5px;
            opacity: 0.6;
            stroke-dasharray: 4, 2;
        }
         .link.help {
            stroke: #3498db; /* Blue for help/aid */
            stroke-width: 2px;
            opacity: 0.7;
        }

        .link-label {
            font-size: 8px;
            fill: #f1c40f;
            text-anchor: middle;
            pointer-events: none;
            font-weight: bold;
            text-shadow: 0 0 3px rgba(0,0,0,0.8);
        }

        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(46, 64, 83, 0.95);
            padding: 20px;
            border-radius: 10px;
            color: #fff;
            max-width: 400px;
            border: 2px solid #f1c40f;
            max-height: 85vh;
            overflow-y: auto;
            z-index: 10;
        }

        .controls h2 {
            margin: 0 0 10px 0;
            color: #f1c40f;
            font-size: 1.3em;
            text-shadow: 0 0 10px #f1c40f;
        }

        .controls h3 {
            margin: 12px 0 8px 0;
            color: #3498db;
            font-size: 0.9em;
            border-bottom: 1px solid #f1c40f;
            padding-bottom: 5px;
        }

        .filter-btn {
            background: rgba(52, 152, 219, 0.2);
            color: #3498db;
            border: 1px solid #3498db;
            padding: 6px 10px;
            margin: 3px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8em;
            transition: all 0.3s;
            display: inline-block;
        }

        .filter-btn.active {
            background: #f1c40f;
            color: #2e4053;
            box-shadow: 0 0 10px #f1c40f;
        }

        .controls button {
            background: #3498db;
            color: #2e4053;
            border: none;
            padding: 8px 15px;
            margin: 4px 4px 4px 0;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85em;
            transition: all 0.3s;
        }

        .controls button:hover {
            background: #f1c40f;
        }

        .legend {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(46, 64, 83, 0.95);
            padding: 15px;
            border-radius: 10px;
            color: #fff;
            border: 2px solid #3498db;
            max-height: 85vh;
            overflow-y: auto;
            max-width: 280px;
            z-index: 9;
            font-size: 0.8em;
        }

        .legend h3 {
            margin: 0 0 10px 0;
            color: #f1c40f;
            font-size: 0.95em;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
            font-size: 0.75em;
        }

        .legend-color {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            margin-right: 8px;
            border: 1px solid #fff;
            flex-shrink: 0;
        }

        .info-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(46, 64, 83, 0.98);
            padding: 15px;
            border-radius: 10px;
            color: #fff;
            max-width: 380px;
            display: none;
            border: 2px solid #3498db;
            max-height: 400px;
            overflow-y: auto;
            z-index: 10;
            font-size: 0.85em;
        }

        .info-panel h3 {
            margin: 0 0 8px 0;
            color: #f1c40f;
            font-size: 0.95em;
        }

        .info-section {
            background: rgba(52, 152, 219, 0.1);
            padding: 8px;
            margin: 6px 0;
            border-left: 2px solid #3498db;
            border-radius: 2px;
            font-size: 0.8em;
        }

        .tooltip {
            position: absolute;
            background: rgba(0,0,0,0.9);
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.8em;
            pointer-events: none;
            display: none;
            border: 1px solid #f1c40f;
            z-index: 20;
        }

        .close-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #e74c3c;
            color: #fff;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
<div class="controls">
    <h2>🎲 NALA & DAMAYANTI</h2>
    <p style="font-size: 0.8em; margin-bottom: 8px;">From Mahabharata (Vana Parva)</p>

    <h3>Filter by Type</h3>
    <div>
        <button class="filter-btn active" onclick="toggleFilter('hero')">👑 Heroes</button>
        <button class="filter-btn active" onclick="toggleFilter('character')">👤 Characters</button>
        <button class="filter-btn active" onclick="toggleFilter('divine')">✨ Divine</button>
        <button class="filter-btn active" onclick="toggleFilter('antagonist')">😈 Antagonists</button>
        <button class="filter-btn active" onclick="toggleFilter('event')">🎭 Events</button>
        <button class="filter-btn active" onclick="toggleFilter('place')">📍 Locations</button>
    </div>

    <h3 style="margin-top: 12px;">Actions</h3>
    <button onclick="resetSimulation()">🔄 Reset</button>
    <button onclick="showStats()">📊 Stats</button>
</div>

<div class="legend">
    <h3>LEGEND</h3>
    <strong style="color: #f1c40f;">Node Types</strong>
    <div class="legend-item">
        <div class="legend-color" style="background: #f1c40f;"></div>
        <span>Main Heroes</span>
    </div>
    <div class="legend-item">
        <div class="legend-color" style="background: #3498db;"></div>
        <span>Divine Beings</span>
    </div>
    <div class="legend-item">
        <div class="legend-color" style="background: #e74c3c;"></div>
        <span>Antagonists</span>
    </div>
    <div class="legend-item">
        <div class="legend-color" style="background: #2ecc71;"></div>
        <span>Places & Events</span>
    </div>
    <hr style="border-color: rgba(52, 152, 219, 0.3); margin: 8px 0;">
    <strong style="color: #f1c40f;">Relationships</strong>
    <div class="legend-item">
        <div style="width: 20px; height: 2px; background: #f1c40f; margin-right: 8px;"></div>
        Love/Family
    </div>
    <div class="legend-item">
        <div style="width: 20px; height: 2px; background: #8e44ad; margin-right: 8px;"></div>
        Divine Intervention
    </div>
    <div class="legend-item">
        <div style="width: 20px; height: 2px; background: #e74c3c; margin-right: 8px;"></div>
        Conflict/Curse
    </div>
    <div class="legend-item">
        <div style="width: 20px; height: 2px; background: #2ecc71; margin-right: 8px;"></div>
        Journey/Path
    </div>
</div>

<div class="info-panel" id="infoPanel">
    <button class="close-btn" onclick="closeInfo()">✕</button>
    <h3 id="nodeTitle"></h3>
    <div id="nodeDescription"></div>
</div>

<div class="tooltip" id="tooltip"></div>
<svg id="graph"></svg>

<script>
    // *** START NODES ***
    const nodes = [
        // MAIN HEROES
        {id: "Nala", type: "hero", color: "#f1c40f", size: 35, description: "👑 King of Nishadha | Virtuous, handsome, skilled charioteer | Cursed by Kali | Gambler in adversity"},
        {id: "Damayanti", type: "hero", color: "#f1c40f", size: 33, description: "👸 Princess of Vidarbha | Beautiful, chaste, devoted wife | Endures great suffering during separation"},
        {id: "Indrasena", type: "character", color: "#f1c40f", size: 18, description: "👶 Son of Nala and Damayanti"},
        {id: "Indrasena (daughter)", type: "character", color: "#f1c40f", size: 18, description: "👧 Daughter of Nala and Damayanti"},

        // DIVINE FIGURES
        {id: "Indra", type: "divine", color: "#3498db", size: 25, description: "⚡ King of Gods | Initially desires Damayanti, but blesses Nala"},
        {id: "Agni", type: "divine", color: "#3498db", size: 23, description: "🔥 God of Fire | Blesses Nala, helps during the swayamvara"},
        {id: "Varuna", type: "divine", color: "#3498db", size: 23, description: "🌊 God of Water | Blesses Nala during the swayamvara"},
        {id: "Yama", type: "divine", color: "#3498db", size: 23, description: "💀 God of Death/Justice | Blesses Nala during the swayamvara"},
        {id: "Saraswati", type: "divine", color: "#3498db", size: 22, description: "🕊️ Goddess of Knowledge and Arts | Helps Damayanti's decision"},
        {id: "Vayu", type: "divine", color: "#3498db", size: 22, description: "💨 God of Wind | Delivers messages for Nala early on"},

        // ANTAGONISTS & HELPERS
        {id: "Kali", type: "antagonist", color: "#e74c3c", size: 28, description: "😈 Personification of the Kali Yuga (evil age) | Possesses Nala | Instigates the dice game and subsequent miseries"},
        {id: "Dwapara", type: "antagonist", color: "#e74c3c", size: 20, description: "🎲 Kali's companion | Spirit of dice and gambling | Influences Pushkara"},
        {id: "Pushkara", type: "antagonist", color: "#e74c3c", size: 25, description: "👑 Brother of Nala | Challenged Nala to the dice game | Takes Nala's kingdom"},
        {id: "Rituparna", type: "character", color: "#2ecc71", size: 24, description: "👑 King of Ayodhya | Skilled in dice, unskilled in horses | Exchanges knowledge with Nala"},
        {id: "Bahu", type: "character", color: "#e74c3c", size: 20, description: "👨‍🍳 Nala's disguised name | Charioteer and cook for Rituparna"},
        {id: "Vahuka", type: "character", color: "#2ecc71", size: 20, description: "👨‍🍳 Nala's disguised name in Rituparna's court | Master of horses and cook"},
        {id: "Karkotaka", type: "character", color: "#3498db", size: 25, description: "🐍 Serpent King | Curses Nala to change his appearance | Gives Nala the poison to remove Kali"},
        {id: "Sudeva", type: "character", color: "#2ecc71", size: 20, description: "🕵️‍♂️ Brahmin messenger | Sent by Damayanti to find Nala"},
        {id: "Brahmin Messengers", type: "character", color: "#2ecc71", size: 18, description: "🗣️ Sent by Damayanti to search for Nala throughout kingdoms"},
        {id: "King Bhima", type: "character", color: "#2ecc71", size: 25, description: "👑 King of Vidarbha | Father of Damayanti | Provides refuge for his daughter and grandchildren"},
        {id: "Queen Sunanda", type: "character", color: "#2ecc71", size: 22, description: "👸 Queen of Vidarbha | Mother of Damayanti"},
        {id: "Swan Messenger", type: "character", color: "#3498db", size: 20, description: "🦢 Sent by Nala to Damayanti, describing his love for her. Initiates their romance."},


        // KEY LOCATIONS & EVENTS
        {id: "Nishadha", type: "place", color: "#2ecc71", size: 22, description: "📍 Nala's kingdom | Lost in the dice game"},
        {id: "Vidarbha", type: "place", color: "#2ecc71", size: 22, description: "📍 Damayanti's kingdom | Home of King Bhima"},
        {id: "Ayodhya", type: "place", color: "#2ecc71", size: 20, description: "📍 Rituparna's kingdom | Where Nala (as Bahu/Vahuka) serves"},
        {id: "Forest (Vana)", type: "place", color: "#2ecc71", size: 28, description: "🌳 Place of Nala and Damayanti's separation and hardship"},
        {id: "Swayamvara", type: "event", color: "#2ecc71", size: 25, description: "🎉 Damayanti's marriage ceremony | Gods attempt to win her hand"},
        {id: "Dice Game", type: "event", color: "#e74c3c", size: 25, description: "🎲 Nala gambles his kingdom away to Pushkara, influenced by Kali"},
        {id: "Separation", type: "event", color: "#e74c3c", size: 28, description: "💔 Nala abandons Damayanti in the forest due to Kali's influence"},
        {id: "Reunion", type: "event", color: "#f1c40f", size: 28, description: "💕 Nala and Damayanti are reunited through Damayanti's cleverness"},
        {id: "Kali's Departure", type: "event", color: "#3498db", size: 20, description: "✨ Kali is expelled from Nala's body | Nala regains his true self"},
        {id: "Second Swayamvara", type: "event", color: "#2ecc71", size: 25, description: "💡 Damayanti's stratagem to find Nala, attracting kings to Vidarbha"},
        {id: "Reclaiming Kingdom", type: "event", color: "#f1c40f", size: 20, description: "⚔️ Nala challenges Pushkara again and wins back his kingdom"},
    ];

    // *** START LINKS ***
    const links = [
        // CORE RELATIONSHIPS
        {source: "Nala", target: "Damayanti", type: "relation", label: "Husband/Wife"},
        {source: "Nala", target: "Indrasena", type: "relation", label: "Father"},
        {source: "Nala", target: "Indrasena (daughter)", type: "relation", label: "Father"},
        {source: "Damayanti", target: "Indrasena", type: "relation", label: "Mother"},
        {source: "Damayanti", target: "Indrasena (daughter)", type: "relation", label: "Mother"},
        {source: "King Bhima", target: "Damayanti", type: "relation", label: "Father"},
        {source: "Queen Sunanda", target: "Damayanti", type: "relation", label: "Mother"},
        {source: "Nala", target: "Pushkara", type: "relation", label: "Brother"},

        // ROMANCE INITIATION
        {source: "Nala", target: "Swan Messenger", type: "relation", label: "Sends"},
        {source: "Swan Messenger", target: "Damayanti", type: "relation", label: "Carries message to"},

        // DIVINE INTERVENTION
        {source: "Indra", target: "Swayamvara", type: "divine", label: "Attends"},
        {source: "Agni", target: "Swayamvara", type: "divine", label: "Attends"},
        {source: "Varuna", target: "Swayamvara", type: "divine", label: "Attends"},
        {source: "Yama", target: "Swayamvara", type: "divine", label: "Attends"},
        {source: "Indra", target: "Nala", type: "divine", label: "Blesses"},
        {source: "Agni", target: "Nala", type: "divine", label: "Blesses"},
        {source: "Varuna", target: "Nala", type: "divine", label: "Blesses"},
        {source: "Yama", target: "Nala", type: "divine", label: "Blesses"},
        {source: "Saraswati", target: "Damayanti", type: "divine", label: "Guides choice"},
        {source: "Kali", target: "Nala", type: "conflict", label: "Possesses"},
        {source: "Dwapara", target: "Pushkara", type: "conflict", label: "Influences"},
        {source: "Karkotaka", target: "Nala", type: "help", label: "Helps/Curses"},
        {source: "Karkotaka", target: "Kali's Departure", type: "help", label: "Aids in"},
        {source: "Vayu", target: "Nala", type: "divine", label: "Aids messages"},

        // KEY EVENTS & THEIR CONNECTIONS
        {source: "Nala", target: "Swayamvara", type: "event", label: "Attends"},
        {source: "Damayanti", target: "Swayamvara", type: "event", label: "Chooses in"},
        {source: "Nala", target: "Dice Game", type: "conflict", label: "Plays"},
        {source: "Pushkara", target: "Dice Game", type: "conflict", label: "Wins"},
        {source: "Nala", target: "Nishadha", type: "conflict", label: "Loses"},
        {source: "Nala", target: "Separation", type: "conflict", label: "Initiates"},
        {source: "Damayanti", target: "Separation", type: "conflict", label: "Suffers"},
        {source: "Nala", target: "Forest (Vana)", type: "journey", label: "Wanders in"},
        {source: "Damayanti", target: "Forest (Vana)", type: "journey", label: "Wanders in"},
        {source: "Rituparna", target: "Ayodhya", type: "place", label: "Rules"},
        {source: "Nala", target: "Bahu", type: "relation", label: "Disguised as"},
        {source: "Nala", target: "Vahuka", type: "relation", label: "Disguised as"},
        {source: "Bahu", target: "Rituparna", type: "help", label: "Serves"},
        {source: "Vahuka", target: "Rituparna", type: "help", label: "Serves"},
        {source: "Damayanti", target: "Sudeva", type: "help", label: "Sends"},
        {source: "Sudeva", target: "Nala", type: "help", label: "Searches for"},
        {source: "Damayanti", target: "Brahmin Messengers", type: "help", label: "Sends"},
        {source: "Nala", target: "Kali's Departure", type: "help", label: "Experiences"},
        {source: "Damayanti", target: "Second Swayamvara", type: "help", label: "Arranges"},
        {source: "Rituparna", target: "Second Swayamvara", type: "journey", label: "Travels to"},
        {source: "Nala", target: "Second Swayamvara", type: "journey", label: "Travels to (as Vahuka)"},
        {source: "Nala", target: "Reunion", type: "relation", label: "Achieves"},
        {source: "Damayanti", target: "Reunion", type: "relation", label: "Achieves"},
        {source: "Nala", target: "Reclaiming Kingdom", type: "relation", label: "Initiates"},
        {source: "Pushkara", target: "Reclaiming Kingdom", type: "conflict", label: "Loses in"},
        {source: "Nala", target: "Nishadha", type: "relation", label: "Regains"},
        {source: "Indrasena", target: "King Bhima", type: "relation", label: "Grandchild of"},
        {source: "Indrasena (daughter)", target: "King Bhima", type: "relation", label: "Grandchild of"},
        {source: "Nala", target: "King Bhima", type: "relation", label: "Son-in-law"},
        {source: "Damayanti", target: "Vidarbha", type: "place", label: "Princess of"},
        {source: "Indrasena", target: "Vidarbha", type: "place", label: "Sent to"},
        {source: "Indrasena (daughter)", target: "Vidarbha", type: "place", label: "Sent to"},
    ];

    let activeFilters = {hero: true, character: true, divine: true, antagonist: true, event: true, place: true};

    const width = window.innerWidth;
    const height = window.innerHeight;

    const svg = d3.select("#graph")
        .attr("width", width)
        .attr("height", height);

    const simulation = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links).id(d => d.id).distance(150).strength(0.7))
        .force("charge", d3.forceManyBody().strength(-600))
        .force("center", d3.forceCenter(width / 2, height / 2))
        .force("collision", d3.forceCollide().radius(d => d.size + 15));

    const linkGroup = svg.append("g").attr("class", "links");
    const link = linkGroup.selectAll("line")
        .data(links).enter().append("line")
        .attr("class", d => `link ${d.type}`)
        .attr("stroke-width", d => d.type === "conflict" || d.type === "relation" ? 2.5 : 1.5);

    const linkLabels = linkGroup.selectAll(".link-label")
        .data(links).enter().append("text")
        .attr("class", "link-label")
        .attr("dy", -5)
        .attr("text-anchor", "middle")
        .text(d => d.label);

    const node = svg.append("g").selectAll("g")
        .data(nodes).enter().append("g")
        .attr("class", "node")
        .call(d3.drag()
            .on("start", dragstarted)
            .on("drag", dragged)
            .on("end", dragended));

    node.append("circle")
        .attr("r", d => d.size)
        .attr("fill", d => d.color);

    node.append("text")
        .text(d => d.id)
        .attr("y", d => d.size + 12);

    node.on("mouseover", function(event, d) {
        showTooltip(event, d);
    }).on("mouseout", function() {
        hideTooltip();
    }).on("click", function(event, d) {
        showInfo(d);
    });

    simulation.on("tick", () => {
        link.attr("x1", d => d.source.x)
            .attr("y1", d => d.source.y)
            .attr("x2", d => d.target.x)
            .attr("y2", d => d.target.y);

        linkLabels.attr("x", d => (d.source.x + d.target.x) / 2)
            .attr("y", d => (d.source.y + d.target.y) / 2);

        node.attr("transform", d => `translate(${d.x},${d.y})`);
    });

    function dragstarted(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
    }

    function dragged(event, d) {
        d.fx = event.x;
        d.fy = event.y;
    }

    function dragended(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null;
        d.fy = null;
    }

    function showTooltip(event, d) {
        d3.select("#tooltip")
            .style("display", "block")
            .style("left", (event.pageX + 10) + "px")
            .style("top", (event.pageY - 10) + "px")
            .html(`<strong>${d.id}</strong><br/>${d.description}`);
    }

    function hideTooltip() {
        d3.select("#tooltip").style("display", "none");
    }

    function showInfo(d) {
        document.getElementById("nodeTitle").textContent = d.id + (d.type ? ` (${d.type})` : "");

        let typeInfo = d.type ? `<div class="info-section"><strong>Type:</strong> ${d.type.charAt(0).toUpperCase() + d.type.slice(1)}</div>` : '';

        document.getElementById("nodeDescription").innerHTML =
            typeInfo +
            `<div class="info-section"><strong>Description:</strong> ${d.description}</div>`;
        document.getElementById("infoPanel").style.display = "block";
    }

    function closeInfo() {
        document.getElementById("infoPanel").style.display = "none";
    }

    function toggleFilter(type) {
        activeFilters[type] = !activeFilters[type];
        document.querySelector(`[onclick="toggleFilter('${type}')"]`).classList.toggle("active");
        updateVisibility();
    }

    function updateVisibility() {
        node.style("display", d => activeFilters[d.type] ? "block" : "none");

        link.style("display", d => {
            const sourceVisible = activeFilters[d.source.type];
            const targetVisible = activeFilters[d.target.type];
            return sourceVisible && targetVisible ? "block" : "none";
        });

        linkLabels.style("display", d => {
            const sourceVisible = activeFilters[d.source.type];
            const targetVisible = activeFilters[d.target.type];
            return sourceVisible && targetVisible ? "block" : "none";
        });
    }

    function resetSimulation() {
        simulation.alpha(0.3).restart();
    }

    function showStats() {
        alert(`📊 NALA & DAMAYANTI STATISTICS\n\nTotal Characters, Places & Events: ${nodes.length}\nTotal Relationships & Conflict Points: ${links.length}\n\nThis knowledge graph maps the central narrative of the Nala-Damayanti story, highlighting the roles of the gods, the antagonist Kali, the period of separation, and their eventual reunion.`);
    }

    updateVisibility();
</script>
</body>
</html>
