        {source: "Yudhishthira", target: "Vidura", type: "alliance", label: "Respected Advisor"},
        {source: "Pandu", target: "Dhritarashtra", type: "alliance", label: "Brother/Co-King"},
        {source: "Yudhishthira", target: "Virata", type: "alliance", label: "Sheltered by"},
        {source: "Arjuna", target: "Satyaki", type: "alliance", label: "Loyal Ally"},
        {source: "Dhritarashtra", target: "Sanjaya", type: "alliance", label: "Narrated to"},
        {source: "Hanuman", target: "Arjuna", type: "alliance", label: "Chariot Protector"},

        // --- MENTORSHIP ---
        {source: "Dronacharya", target: "Arjuna", type: "mentor", label: "Guru"},
        {source: "Dronacharya", target: "Ekalavya", type: "mentor", label: "Guru (demanded thumb)"},
        {source: "Balarama", target: "Bhima", type: "mentor", label: "Gada Guru"},
        {source: "Balarama", target: "Duryodhana", type: "mentor", label: "Gada Guru"},

        // --- DIVINE INTERACTION ---
        {source: "Vyasa", target: "Ganesha", type: "divine", label: "Dictator/Scribe"},
        {source: "Hanuman", target: "Bhima", type: "divine", label: "Brother (Sons of Vayu)"},

        // --- EVENT & TIMELINE LINKS ---
        {source: "Birth of Kuru Clan", target: "Shantanu", type: "event", label: "Patriarch"},
        {source: "Birth of Kuru Clan", target: "Dice Game", type: "timeline", label: "Era Start"},
        {source: "Shakuni", target: "Dice Game", type: "event", label: "Orchestrated"},
        {source: "Dushasana", target: "Dice Game", type: "event", label: "Tormentor in"},
        {source: "Dice Game", target: "The Exile (Vanavasa)", type: "timeline", label: "Led to"},
        {source: "The Exile (Vanavasa)", target: "Kichaka", type: "event", label: "Incident in"},
        {source: "The Exile (Vanavasa)", target: "Bhagavad Gita", type: "timeline", label: "Pre-War"},
        {source: "Krishna", target: "Bhagavad Gita", type: "event", label: "Giver"},
        {source: "Bhagavad Gita", target: "Kurukshetra War", type: "timeline", label: "War Begins"},
        {source: "Kurukshetra War", target: "Ascension to Heaven", type: "timeline", label: "Final Journey"},
    ];

    let activeFilters = {hero: true, character: true, divine: true, event: true};

    const width = window.innerWidth;
    const height = window.innerHeight;

    const svg = d3.select("#graph")
        .attr("width", width)
        .attr("height", height);

    const simulation = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links).id(d => d.id).distance(120).strength(0.7)) // Increased distance, slightly lower strength
        .force("charge", d3.forceManyBody().strength(-450)) // Slightly stronger repulsion
        .force("center", d3.forceCenter(width / 2, height / 2))
        .force("collision", d3.forceCollide().radius(d => d.size + 15)); // Increased collision radius

    const linkGroup = svg.append("g").attr("class", "links");
    const link = linkGroup.selectAll("line")
        .data(links).enter().append("line")
        .attr("class", d => `link ${d.type}`)
        .attr("stroke-width", d => d.type === "family" ? 2.5 : 1.5);

    const linkLabels = linkGroup.selectAll(".link-label")
        .data(links).enter().append("text")
        .attr("class", "link-label")
        .attr("dy", -5)
        .attr("text-anchor", "middle")
        .text(d => d.label);

    const node = svg.append("g").selectAll("g")
        .data(nodes).enter().append("g")
        .attr("class", "node")
        .call(d3.drag()
            .on("start", dragstarted)
            .on("drag", dragged)
            .on("end", dragended));

    node.append("circle")
        .attr("r", d => d.size)
        .attr("fill", d => d.color);

    node.append("text")
        .text(d => d.id)
        .attr("y", d => d.size + 12);

    node.on("mouseover", function(event, d) {
        showTooltip(event, d);
    }).on("mouseout", function() {
        hideTooltip();
    }).on("click", function(event, d) {
        showInfo(d);
    });

    simulation.on("tick", () => {
        link.attr("x1", d => d.source.x)
            .attr("y1", d => d.source.y)
            .attr("x2", d => d.target.x)
            .attr("y2", d => d.target.y);

        linkLabels.attr("x", d => (d.source.x + d.target.x) / 2)
            .attr("y", d => (d.source.y + d.target.y) / 2);

        node.attr("transform", d => `translate(${d.x},${d.y})`);
    });

    function dragstarted(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
    }

    function dragged(event, d) {
        d.fx = event.x;
        d.fy = event.y;
    }

    function dragended(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null;
        d.fy = null;
    }

    function showTooltip(event, d) {
        d3.select("#tooltip")
            .style("display", "block")
            .style("left", (event.pageX + 10) + "px")
            .style("top", (event.pageY - 10) + "px")
            .html(`<strong>${d.id}</strong><br/>${d.description}`);
    }

    function hideTooltip() {
        d3.select("#tooltip").style("display", "none");
    }

    function showInfo(d) {
        document.getElementById("nodeTitle").textContent = d.id + (d.type ? ` (${d.type})` : "");

        let factionInfo = d.faction ? `<div class="info-section"><strong>Faction:</strong> ${d.faction.charAt(0).toUpperCase() + d.faction.slice(1)}</div>` : '';

        document.getElementById("nodeDescription").innerHTML =
            `<div class="info-section"><strong>Type:</strong> ${d.type.charAt(0).toUpperCase() + d.type.slice(1)}</div>` +
            factionInfo +
            `<div class="info-section"><strong>Description:</strong> ${d.description}</div>`;
        document.getElementById("infoPanel").style.display = "block";
    }

    function closeInfo() {
        document.getElementById("infoPanel").style.display = "none";
    }

    function toggleFilter(type) {
        activeFilters[type] = !activeFilters[type];
        document.querySelector(`[onclick="toggleFilter('${type}')"]`).classList.toggle("active");
        updateVisibility();
    }

    function updateVisibility() {
        node.style("display", d => activeFilters[d.type] ? "block" : "none");

        // Filter links based on whether BOTH source and target nodes are visible
        link.style("display", d => {
            const sourceVisible = activeFilters[d.source.type];
            const targetVisible = activeFilters[d.target.type];
            return sourceVisible && targetVisible ? "block" : "none";
        });

        // Filter link labels based on whether BOTH source and target nodes are visible
         linkLabels.style("display", d => {
            const sourceVisible = activeFilters[d.source.type];
            const targetVisible = activeFilters[d.target.type];
            return sourceVisible && targetVisible ? "block" : "none";
        });
    }

    function resetSimulation() {
        simulation.alpha(0.3).restart();
    }

    function showStats() {
        alert(`ðŸ“Š MAHABHARATA STATISTICS (Stabilized Edition)\n\nTotal Characters & Events: ${nodes.length}\nTotal Relationships: ${links.length}\n\nThe graph has been stabilized by refining data and tuning the D3 force simulation parameters (link distance, repulsion, and collision radius).`);
    }

    updateVisibility();
</script>
</body>
</html>
