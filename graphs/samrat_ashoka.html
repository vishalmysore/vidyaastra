<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VidyaAstra: Samrat Ashoka Network</title>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <style>
        * {margin:0; padding:0; box-sizing:border-box;}
        body {font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg,#14213d,#1d3557,#2a9d8f); color:#fff; overflow:hidden;}
        svg {display:block; background:transparent;}
        .node circle {stroke:#fff; stroke-width:2px; cursor:pointer; transition:.3s; filter:drop-shadow(0 0 6px rgba(255,255,255,.25));}
        .node:hover circle {stroke-width:4px; filter:drop-shadow(0 0 12px rgba(255,255,255,.8));}
        .node text {font-size:10px; font-weight:600; pointer-events:none; text-anchor:middle; fill:#fff; text-shadow:1px 1px 2px rgba(0,0,0,.7);}
        .link {stroke:rgba(255,255,255,.15); stroke-width:1px;}
        .link.family {stroke:#e9c46a; stroke-width:2.5px;}
        .link.war {stroke:#d62828; stroke-width:2.5px;}
        .link.administration {stroke:#2a9d8f; stroke-width:2px;}
        .link.religious {stroke:#9d84b7; stroke-width:2px;}
        .link.conquest {stroke:#f4a261; stroke-width:2px;}
        .link.mentor {stroke:#264653; stroke-width:2px;}
        .link.alliance {stroke:#457b9d; stroke-width:2px;}
        .link-label {font-size:8px; fill:#ffdfa3; text-anchor:middle; pointer-events:none; font-weight:600; text-shadow:0 0 3px rgba(0,0,0,.9);}
        .controls {position:absolute; top:15px; left:15px; background:rgba(20,33,61,.9); padding:15px 18px; border:2px solid #2a9d8f; border-radius:10px; max-width:360px; max-height:85vh; overflow-y:auto; z-index:10;}
        .controls h2 {font-size:1.3em; margin:0 0 8px; color:#e9c46a; text-shadow:0 0 6px #e9c46a;}
        .controls h3 {margin:12px 0 6px; font-size:.85em; color:#2a9d8f; border-bottom:1px solid #e9c46a; padding-bottom:4px;}
        .filter-btn {background:rgba(42,157,143,.15); color:#2a9d8f; border:1px solid #2a9d8f; padding:6px 10px; margin:3px 3px 6px 0; border-radius:5px; font-size:.75em; font-weight:600; cursor:pointer; transition:.25s; display:inline-block;}
        .filter-btn.active {background:#e9c46a; color:#14213d; box-shadow:0 0 8px #e9c46a;}
        .controls button.action {background:#2a9d8f; color:#14213d; border:none; padding:7px 14px; margin:4px 4px 4px 0; border-radius:5px; font-size:.75em; font-weight:700; cursor:pointer; transition:.25s;}
        .controls button.action:hover {background:#e76f51; color:#fff;}
        .info-panel {position:absolute; bottom:20px; right:20px; background:rgba(20,33,61,.95); padding:15px; border:2px solid #2a9d8f; border-radius:10px; max-width:380px; display:none; max-height:420px; overflow-y:auto; z-index:10; font-size:.85em;}
        .info-panel h3 {margin:0 0 8px; color:#e9c46a; font-size:1em;}
        .info-section {background:rgba(42,157,143,.12); padding:6px 8px; margin:6px 0; border-left:3px solid #2a9d8f; border-radius:3px; font-size:.8em;}
        .close-btn {position:absolute; top:8px; right:8px; background:#d62828; color:#fff; border:none; width:24px; height:24px; border-radius:50%; cursor:pointer; font-weight:700; font-size:.8em;}
        .tooltip {position:absolute; background:rgba(0,0,0,.85); color:#fff; padding:6px 9px; border-radius:4px; font-size:.75em; pointer-events:none; display:none; border:1px solid #e9c46a; z-index:20;}
        .legend {position:absolute; top:15px; right:15px; background:rgba(20,33,61,.9); padding:12px 15px; border:2px solid #9d84b7; border-radius:10px; max-width:260px; max-height:85vh; overflow-y:auto; font-size:.75em; z-index:9;}
        .legend h3 {margin:0 0 8px; font-size:.9em; color:#e9c46a;}
        .legend-item {display:flex; align-items:center; margin:4px 0;}
        .legend-color {width:14px; height:14px; border-radius:50%; margin-right:6px; border:1px solid #fff;}
    </style>
</head>
<body>
    <div class="controls">
        <h2>🛕 SAMRAT ASHOKA</h2>
        <p style="font-size:.7em; margin-bottom:6px; opacity:.8;">Project VidyaAstra</p>
        <h3>Filter by Type</h3>
        <div>
            <button class="filter-btn active" onclick="toggleFilter('royal')">👑 Royal</button>
            <button class="filter-btn active" onclick="toggleFilter('general')">⚔️ General/Admin</button>
            <button class="filter-btn active" onclick="toggleFilter('enemy')">🟥 Enemy/Rival</button>
            <button class="filter-btn active" onclick="toggleFilter('religious')">🙏 Religious</button>
            <button class="filter-btn active" onclick="toggleFilter('territory')">🗺️ Territory</button>
            <button class="filter-btn active" onclick="toggleFilter('event')">📜 Event</button>
        </div>
        <h3>Actions</h3>
        <button class="action" onclick="resetSimulation()">🔄 Reset</button>
        <button class="action" onclick="showStats()">📊 Stats</button>
    </div>
    <div class="legend">
        <h3>Legend</h3>
        <div class="legend-item"><div class="legend-color" style="background:#2a9d8f"></div><span>Maurya Royal</span></div>
        <div class="legend-item"><div class="legend-color" style="background:#f4a261"></div><span>General / Admin</span></div>
        <div class="legend-item"><div class="legend-color" style="background:#d62828"></div><span>Enemy / Rival / War</span></div>
        <div class="legend-item"><div class="legend-color" style="background:#9d84b7"></div><span>Religious / Buddhist</span></div>
        <div class="legend-item"><div class="legend-color" style="background:#457b9d"></div><span>Territory / City</span></div>
        <div class="legend-item"><div class="legend-color" style="background:#e9c46a"></div><span>Event / Milestone</span></div>
        <hr style="border-color:rgba(255,255,255,.2); margin:8px 0;"/>
        <strong style="color:#e9c46a; font-size:.75em;">Relationship Colors</strong>
        <div class="legend-item"><div style="width:22px; height:3px; background:#e9c46a; margin-right:6px;"></div><span>Family</span></div>
        <div class="legend-item"><div style="width:22px; height:3px; background:#d62828; margin-right:6px;"></div><span>War / Conflict</span></div>
        <div class="legend-item"><div style="width:22px; height:3px; background:#2a9d8f; margin-right:6px;"></div><span>Administration</span></div>
        <div class="legend-item"><div style="width:22px; height:3px; background:#f4a261; margin-right:6px;"></div><span>Conquest</span></div>
        <div class="legend-item"><div style="width:22px; height:3px; background:#9d84b7; margin-right:6px;"></div><span>Religious</span></div>
        <div class="legend-item"><div style="width:22px; height:3px; background:#457b9d; margin-right:6px;"></div><span>Alliance / External</span></div>
    </div>
    <div class="info-panel" id="infoPanel">
        <button class="close-btn" onclick="closeInfo()">✕</button>
        <h3 id="nodeTitle"></h3>
        <div id="nodeDescription"></div>
    </div>
    <div class="tooltip" id="tooltip"></div>
    <svg id="graph"></svg>

    <script>
    // *** START NODES ***
    const nodes = [
        // ASHOKA - THE MAIN FIGURE
        {id: "Ashoka", type: "royal", faction: "maurya", color: "#2a9d8f", size: 40,
         description: "👑 Samrat Ashoka the Great | 3rd Mauryan Emperor (268-232 BCE) | Conquered Kalinga | Later became Buddhist pacifist | Greatest emperor of India"},

        // MAURYAN ROYAL FAMILY
        {id: "Chandragupta Maurya", type: "royal", faction: "maurya", color: "#2a9d8f", size: 28,
         description: "👑 Founder of Mauryan Empire | Grandfather of Ashoka | Abdicated and became Jain monk"},
        {id: "Bindusara", type: "royal", faction: "maurya", color: "#2a9d8f", size: 30,
         description: "👑 Father of Ashoka | Also called Amitraghata (Destroyer of Enemies) | Ruled before Ashoka"},
        {id: "Devi", type: "royal", faction: "maurya", color: "#e76f51", size: 24,
         description: "👸 Mother of Ashoka | Wife of Bindusara | Born as merchant's daughter"},
        {id: "Radhika", type: "royal", faction: "maurya", color: "#e76f51", size: 20,
         description: "👸 Wife of Ashoka | Mother of Mahinda and Sanghamitta"},
        {id: "Mahinda", type: "royal", faction: "maurya", color: "#e76f51", size: 22,
         description: "🧑 Son of Ashoka | Buddhist missionary | Took Buddhism to Sri Lanka"},
        {id: "Sanghamitta", type: "royal", faction: "maurya", color: "#e76f51", size: 20,
         description: "🧑 Daughter of Ashoka | Buddhist nun | Took Bodhi tree to Sri Lanka"},
        {id: "Susima", type: "royal", faction: "maurya", color: "#d62828", size: 22,
         description: "🔪 Half-brother of Ashoka | Died in Ashoka's rise to power | Rival"},

        // GENERALS & MILITARY COMMANDERS
        {id: "Radhagupta", type: "general", faction: "general", color: "#f4a261", size: 24,
         description: "⚔️ Commander of Ashoka's forces | Led conquest of Kalinga"},
        {id: "Khalsi", type: "general", faction: "general", color: "#f4a261", size: 20,
         description: "⚔️ General | Helped expand territories"},
        {id: "Vipula", type: "general", faction: "general", color: "#f4a261", size: 22,
         description: "⚔️ Northern commander | Administered northern territories"},

        // POLITICAL ADVISORS & MINISTERS
        {id: "Radhagupta (Minister)", type: "general", faction: "general", color: "#f4a261", size: 22,
         description: "🧠 Chief Minister | Advisor to Ashoka | Key administrator"},
        {id: "Vishnugupta (Chanakya)", type: "general", faction: "general", color: "#f4a261", size: 23,
         description: "🧠 Ancient advisor | Strategist to Chandragupta | Founder of policies"},

        // ENEMIES & RIVALS
        {id: "Seleucus Nicator", type: "enemy", faction: "enemy", color: "#d62828", size: 24,
         description: "⚔️ Greek general | Founder of Seleucid Empire | Rival to Mauryan Empire | Made peace treaty"},
        {id: "Nanda Dynasty", type: "enemy", faction: "enemy", color: "#d62828", size: 22,
         description: "👑 Previous ruling dynasty | Overthrown by Chandragupta Maurya"},
        {id: "Kalinga King", type: "enemy", faction: "enemy", color: "#d62828", size: 23,
         description: "👑 Independent ruler of Kalinga | Resisted Ashoka's conquest"},
        {id: "Tamraparni Rulers", type: "enemy", faction: "enemy", color: "#d62828", size: 20,
         description: "👑 Rulers of Sri Lanka | Initially foreign relations, later allied"},
        {id: "Chola Kingdom", type: "enemy", faction: "enemy", color: "#d62828", size: 20,
         description: "🏰 Southern kingdom | Independent state during Ashoka's reign"},
        {id: "Pandya Kingdom", type: "enemy", faction: "enemy", color: "#d62828", size: 19,
         description: "🏰 Southern kingdom | Maintained independence"},
        {id: "Kuntala", type: "enemy", faction: "enemy", color: "#d62828", size: 18,
         description: "🏰 Frontier kingdom | Resisted Mauryan expansion"},

        // RELIGIOUS FIGURES
        {id: "Radhagupta (Buddhist)", type: "religious", faction: "religious", color: "#9d84b7", size: 24,
         description: "🙏 Chief Buddhist monk | Influenced Ashoka's conversion | Religious advisor"},
        {id: "Buddha Gautama", type: "religious", faction: "religious", color: "#9d84b7", size: 20,
         description: "🙏 Founder of Buddhism | Died before Ashoka | Inspired conversion"},
        {id: "Ashoka (Buddhist)", type: "religious", faction: "religious", color: "#9d84b7", size: 26,
         description: "🙏 Ashoka as Buddhist convert | Promoter of dharma | Builder of stupas"},
        {id: "Mahakassapa", type: "religious", faction: "religious", color: "#9d84b7", size: 20,
         description: "🙏 Buddhist elder monk | Contemporary of Ashoka"},
        {id: "Upagupta", type: "religious", faction: "religious", color: "#9d84b7", size: 22,
         description: "🙏 Buddhist sage | Mentor in Ashoka's spiritual journey | Teacher"},

        // MAJOR TERRITORIES
        {id: "Pataliputra", type: "territory", faction: "territory", color: "#457b9d", size: 24,
         description: "🏰 Capital city of Mauryan Empire | Power center | Administrative heart"},
        {id: "Kalinga", type: "territory", faction: "territory", color: "#d62828", size: 25,
         description: "🗺️ Eastern coastal kingdom | Conquered in bloodiest war | Major conquest"},
        {id: "Magadha", type: "territory", faction: "territory", color: "#457b9d", size: 22,
         description: "🗺️ Core Mauryan territory | Center of power"},
        {id: "Deccan", type: "territory", faction: "territory", color: "#457b9d", size: 20,
         description: "🗺️ Southern plateau | Conquered and administered"},
        {id: "Tamraparni", type: "territory", faction: "territory", color: "#457b9d", size: 19,
         description: "🗺️ Sri Lanka | Peace & Buddhism sent through Mahinda"},
        {id: "Northwest Territories", type: "territory", faction: "territory", color: "#457b9d", size: 20,
         description: "🗺️ Greek-influenced regions | Seleucid contact"},
        {id: "Bengal", type: "territory", faction: "territory", color: "#457b9d", size: 18,
         description: "🗺️ Eastern region | Major supporter of Ashoka's reign"},

        // MAJOR EVENTS & MILESTONES
        {id: "Rise to Power", type: "event", faction: "event", color: "#f4a261", size: 20,
         description: "📜 Ashoka's ascension to throne (268 BCE) | Succession from Bindusara"},
        {id: "Battle of Kalinga", type: "event", faction: "event", color: "#d62828", size: 24,
         description: "⚔️ Bloodiest conquest (262 BCE) | ~100,000 casualties | Turning point"},
        {id: "Remorse & Conversion", type: "event", faction: "event", color: "#9d84b7", size: 22,
         description: "🙏 Ashoka's conversion to Buddhism | Renounced violence | Spiritual awakening"},
        {id: "Edicts of Ashoka", type: "event", faction: "event", color: "#2a9d8f", size: 22,
         description: "📜 Inscribed moral codes | Spread across empire | Code of dharma"},
        {id: "Stupa Construction", type: "event", faction: "event", color: "#9d84b7", size: 20,
         description: "🏛️ Built 84,000 stupas | Buddhist monuments | Religious legacy"},
        {id: "Missionary Missions", type: "event", faction: "event", color: "#9d84b7", size: 20,
         description: "🌍 Sent monks to foreign lands | Spread Buddhism | Diplomatic missions"},
        {id: "Golden Age", type: "event", faction: "event", color: "#2a9d8f", size: 22,
         description: "✨ Reign (268-232 BCE) | Peace & prosperity | Cultural flourishing"},
        {id: "Death & Legacy", type: "event", faction: "event", color: "#457b9d", size: 18,
         description: "📜 Ashoka's passing (232 BCE) | Left vast empire | Changed history"},
    ];

    // *** START LINKS ***
    const links = [
        // FAMILY RELATIONSHIPS
        {source: "Chandragupta Maurya", target: "Bindusara", type: "family", label: "Father"},
        {source: "Bindusara", target: "Ashoka", type: "family", label: "Father"},
        {source: "Bindusara", target: "Susima", type: "family", label: "Father"},
        {source: "Devi", target: "Ashoka", type: "family", label: "Mother"},
        {source: "Ashoka", target: "Radhika", type: "family", label: "Wife"},
        {source: "Ashoka", target: "Mahinda", type: "family", label: "Son"},
        {source: "Ashoka", target: "Sanghamitta", type: "family", label: "Daughter"},
        {source: "Ashoka", target: "Susima", type: "family", label: "Half-brother"},

        // MILITARY & ADMINISTRATIVE RELATIONSHIPS
        {source: "Ashoka", target: "Radhagupta", type: "administration", label: "Commander"},
        {source: "Ashoka", target: "Khalsi", type: "administration", label: "General"},
        {source: "Ashoka", target: "Vipula", type: "administration", label: "Northern Admin"},
        {source: "Ashoka", target: "Radhagupta (Minister)", type: "administration", label: "Minister"},
        {source: "Chandragupta Maurya", target: "Vishnugupta (Chanakya)", type: "mentor", label: "Advisor"},

        // WARS & CONQUESTS
        {source: "Ashoka", target: "Kalinga King", type: "war", label: "⚔️ Conquered Kalinga"},
        {source: "Ashoka", target: "Kuntala", type: "war", label: "⚔️ Conquered"},
        {source: "Ashoka", target: "Chola Kingdom", type: "war", label: "Diplomatic relations"},
        {source: "Ashoka", target: "Pandya Kingdom", type: "war", label: "Diplomatic relations"},
        {source: "Chandragupta Maurya", target: "Nanda Dynasty", type: "war", label: "⚔️ Overthrew"},
        {source: "Ashoka", target: "Seleucus Nicator", type: "alliance", label: "Peace treaty"},

        // RELIGIOUS CONVERSION & INFLUENCE
        {source: "Ashoka", target: "Radhagupta (Buddhist)", type: "religious", label: "Converted by"},
        {source: "Ashoka", target: "Upagupta", type: "religious", label: "Spiritual guide"},
        {source: "Radhagupta (Buddhist)", target: "Buddha Gautama", type: "religious", label: "Follower"},
        {source: "Ashoka", target: "Ashoka (Buddhist)", type: "religious", label: "Transformation"},

        // MISSIONARY WORK
        {source: "Ashoka", target: "Mahinda", type: "religious", label: "Sent to Tamraparni"},
        {source: "Ashoka", target: "Sanghamitta", type: "religious", label: "Sent to Tamraparni"},
        {source: "Mahinda", target: "Tamraparni", type: "religious", label: "Missionary to"},
        {source: "Sanghamitta", target: "Tamraparni", type: "religious", label: "Bodhi tree to"},

        // TERRITORY CONNECTIONS
        {source: "Ashoka", target: "Pataliputra", type: "administration", label: "Ruled from"},
        {source: "Ashoka", target: "Magadha", type: "administration", label: "Core territory"},
        {source: "Ashoka", target: "Kalinga", type: "conquest", label: "Conquered"},
        {source: "Ashoka", target: "Deccan", type: "conquest", label: "Conquered"},
        {source: "Ashoka", target: "Bengal", type: "administration", label: "Governed"},
        {source: "Ashoka", target: "Northwest Territories", type: "administration", label: "Administered"},

        // MAJOR EVENTS
        {source: "Ashoka", target: "Rise to Power", type: "event", label: "Ascended throne"},
        {source: "Radhagupta", target: "Battle of Kalinga", type: "war", label: "Commanded"},
        {source: "Ashoka", target: "Battle of Kalinga", type: "war", label: "Conquered Kalinga"},
        {source: "Ashoka", target: "Remorse & Conversion", type: "religious", label: "Converted"},
        {source: "Ashoka", target: "Edicts of Ashoka", type: "event", label: "Inscribed"},
        {source: "Ashoka", target: "Stupa Construction", type: "religious", label: "Built"},
        {source: "Ashoka", target: "Missionary Missions", type: "religious", label: "Sent monks"},
        {source: "Ashoka", target: "Golden Age", type: "event", label: "Reign of"},
        {source: "Ashoka", target: "Death & Legacy", type: "event", label: "Left legacy of"}, // <-- CORRECTED LINE
    ];

    let activeFilters = {royal: true, general: true, enemy: true, religious: true, territory: true, event: true};

    const width = window.innerWidth;
    const height = window.innerHeight;

    const svg = d3.select("#graph")
        .attr("width", width)
        .attr("height", height);

    const simulation = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links).id(d => d.id).distance(140).strength(0.65))
        .force("charge", d3.forceManyBody().strength(-500))
        .force("center", d3.forceCenter(width / 2, height / 2))
        .force("collision", d3.forceCollide().radius(d => d.size + 15));

    const linkGroup = svg.append("g").attr("class", "links");
    const link = linkGroup.selectAll("line")
        .data(links).enter().append("line")
        .attr("class", d => `link ${d.type}`)
        .attr("stroke-width", d => d.type === "family" || d.type === "war" ? 2.5 : 1.5);

    const linkLabels = linkGroup.selectAll(".link-label")
        .data(links).enter().append("text")
        .attr("class", "link-label")
        .attr("dy", -5)
        .attr("text-anchor", "middle")
        .text(d => d.label);

    const node = svg.append("g").selectAll("g")
        .data(nodes).enter().append("g")
        .attr("class", "node")
        .call(d3.drag()
            .on("start", dragstarted)
            .on("drag", dragged)
            .on("end", dragended));

    node.append("circle")
        .attr("r", d => d.size)
        .attr("fill", d => d.color);

    node.append("text")
        .text(d => d.id)
        .attr("y", d => d.size + 12);

    node.on("mouseover", function(event, d) {
        showTooltip(event, d);
    }).on("mouseout", function() {
        hideTooltip();
    }).on("click", function(event, d) {
        showInfo(d);
    });

    simulation.on("tick", () => {
        link.attr("x1", d => d.source.x)
            .attr("y1", d => d.source.y)
            .attr("x2", d => d.target.x)
            .attr("y2", d => d.target.y);

        linkLabels.attr("x", d => (d.source.x + d.target.x) / 2)
            .attr("y", d => (d.source.y + d.target.y) / 2);

        node.attr("transform", d => `translate(${d.x},${d.y})`);
    });

    function dragstarted(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x; d.fy = d.y;
    }
    function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
    function dragended(event, d) { if (!event.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }

    function showTooltip(event, d) {
        d3.select("#tooltip")
            .style("display", "block")
            .style("left", (event.pageX + 10) + "px")
            .style("top", (event.pageY - 10) + "px")
            .html(`<strong>${d.id}</strong><br/>${d.description}`);
    }
    function hideTooltip() { d3.select("#tooltip").style("display", "none"); }

    function showInfo(d) {
        document.getElementById("nodeTitle").textContent = d.id + (d.type ? ` (${d.type})` : "");
        let typeInfo = d.type ? `<div class="info-section"><strong>Type:</strong> ${d.type.charAt(0).toUpperCase() + d.type.slice(1)}</div>` : '';
        document.getElementById("nodeDescription").innerHTML = typeInfo + `<div class="info-section"><strong>Role/Description:</strong> ${d.description}</div>`;
        document.getElementById("infoPanel").style.display = "block";
    }
    function closeInfo() { document.getElementById("infoPanel").style.display = "none"; }

    function toggleFilter(type) {
        activeFilters[type] = !activeFilters[type];
        document.querySelector(`[onclick="toggleFilter('${type}')"]`).classList.toggle("active");
        updateVisibility();
    }
    function updateVisibility() {
        node.style("display", d => activeFilters[d.type] ? "block" : "none");
        link.style("display", d => (activeFilters[d.source.type] && activeFilters[d.target.type]) ? "block" : "none");
        linkLabels.style("display", d => (activeFilters[d.source.type] && activeFilters[d.target.type]) ? "block" : "none");
    }
    function resetSimulation() { simulation.alpha(0.3).restart(); }
    function showStats() {
        alert(`📊 SAMRAT ASHOKA STATISTICS\n\nTotal Entities: ${nodes.length}\nTotal Relationships: ${links.length}\n\nThree Life Periods:\n1. Rise to Power (268 BCE) - Warrior Emperor\n2. Battle of Kalinga (262 BCE) - Turning Point\n3. Spiritual Conversion - Buddhist Pacifist\n\nAchievements:\n• Conquered 90% of Indian subcontinent\n• Built 84,000 Buddhist stupas\n• Spread Buddhism across Asia\n• Wrote Edicts on rock and pillars\n• Created Golden Age of Mauryan Empire\n• Transformed from warrior to monk\n\nReign: 268-232 BCE (36 years)\nCapital: Pataliputra\nLegacy: One of history's greatest rulers`);
    }

    updateVisibility();
    window.addEventListener('resize', () => {
        const w = window.innerWidth, h = window.innerHeight;
        svg.attr('width', w).attr('height', h);
        simulation.force('center', d3.forceCenter(w/2, h/2)).alpha(0.1).restart();
    });
    </script>
