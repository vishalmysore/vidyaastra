    const linkGroup = svg.append("g").attr("class", "links");
    const link = linkGroup.selectAll("line")
        .data(links).enter().append("line")
        .attr("class", d => `link ${d.type}`)
        .attr("stroke-width", d => d.type === "family" ? 2.5 : 1.5);

    const linkLabels = linkGroup.selectAll(".link-label")
        .data(links).enter().append("text")
        .attr("class", "link-label")
        .attr("dy", -5)
        .attr("text-anchor", "middle")
        .text(d => d.label);

    const node = svg.append("g").selectAll("g")
        .data(nodes).enter().append("g")
        .attr("class", "node")
        .call(d3.drag()
            .on("start", dragstarted)
            .on("drag", dragged)
            .on("end", dragended));

    node.append("circle")
        .attr("r", d => d.size)
        .attr("fill", d => d.color);

    node.append("text")
        .text(d => d.id)
        .attr("y", d => d.size + 12);

    node.on("mouseover", function(event, d) {
        showTooltip(event, d);
    }).on("mouseout", function() {
        hideTooltip();
    }).on("click", function(event, d) {
        showInfo(d);
    });

    simulation.on("tick", () => {
        link.attr("x1", d => d.source.x)
            .attr("y1", d => d.source.y)
            .attr("x2", d => d.target.x)
            .attr("y2", d => d.target.y);

        linkLabels.attr("x", d => (d.source.x + d.target.x) / 2)
            .attr("y", d => (d.source.y + d.target.y) / 2);

        node.attr("transform", d => `translate(${d.x},${d.y})`);
    });

    function dragstarted(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
    }

    function dragged(event, d) {
        d.fx = event.x;
        d.fy = event.y;
    }

    function dragended(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null;
        d.fy = null;
    }

    function showTooltip(event, d) {
        d3.select("#tooltip")
            .style("display", "block")
            .style("left", (event.pageX + 10) + "px")
            .style("top", (event.pageY - 10) + "px")
            .html(`<strong>${d.id}</strong><br/>${d.description}`);
    }

    function hideTooltip() {
        d3.select("#tooltip").style("display", "none");
    }

    function showInfo(d) {
        document.getElementById("nodeTitle").textContent = d.id + (d.type ? ` (${d.type})` : "");

        let factionInfo = d.faction ? `<div class="info-section"><strong>Faction:</strong> ${d.faction.charAt(0).toUpperCase() + d.faction.slice(1)}</div>` : '';

        document.getElementById("nodeDescription").innerHTML =
            `<div class="info-section"><strong>Type:</strong> ${d.type.charAt(0).toUpperCase() + d.type.slice(1)}</div>` +
            factionInfo +
            `<div class="info-section"><strong>Description:</strong> ${d.description}</div>`;
        document.getElementById("infoPanel").style.display = "block";
    }

    function closeInfo() {
        document.getElementById("infoPanel").style.display = "none";
    }

    function toggleFilter(type) {
        activeFilters[type] = !activeFilters[type];
        document.querySelector(`[onclick="toggleFilter('${type}')"]`).classList.toggle("active");
        updateVisibility();
    }

    function updateVisibility() {
        node.style("display", d => activeFilters[d.type] ? "block" : "none");

        link.style("display", d => {
            const sourceVisible = activeFilters[d.source.type];
            const targetVisible = activeFilters[d.target.type];
            return sourceVisible && targetVisible ? "block" : "none";
        });

        linkLabels.style("display", d => {
            const sourceVisible = activeFilters[d.source.type];
            const targetVisible = activeFilters[d.target.type];
            return sourceVisible && targetVisible ? "block" : "none";
        });
    }

    function resetSimulation() {
        simulation.alpha(0.3).restart();
    }

    function showStats() {
        alert(`ðŸ“Š RAMAYANA STATISTICS\n\nTotal Characters & Events: ${nodes.length}\nTotal Relationships: ${links.length}\n\nThis comprehensive knowledge graph covers all major characters from the Ramayana epic including the main heroes, royal families, demons, divine beings, and key events.`);
    }

    updateVisibility();
</script>
</body>
</html>
